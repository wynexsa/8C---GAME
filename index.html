<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>8-C Hayatta Kalma Simülasyonu</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container" id="app">
    <!-- Karşılama ve Mod Seçimi -->
    <div id="screen-menu" class="center-box">
        <h1>ORUÇ REİS ORTAOKULU</h1>
        <h2>8-C HAYATTA KALMA SİMÜLASYONU</h2>
        <p style="margin-bottom: 20px; color: #8d8d99;">Zil çaldı, ortaokul krizleri seni bekliyor!</p>
        
        <div style="text-align: left; background: #29292e; padding: 15px; border-radius: 6px; margin-bottom: 15px;">
            <label style="font-weight: bold; color: #fba94c;">Karakter Seçimi:</label>
            <select id="char-select">
                <option value="1">Arka Sıra Filozofu (Kaytarıcı)</option>
                <option value="2">Sınav Canavarı (İnek)</option>
                <option value="3">Orta Yolcu (Normal Öğrenci)</option>
                <option value="4">Özel Karakter Yarat</option>
            </select>
            
            <div id="custom-char-box" class="hidden">
                <label>Ad Soyad:</label>
                <input type="text" id="custom-name" placeholder="Örn: Ali Yılmaz">
                <label>Lakap:</label>
                <input type="text" id="custom-nickname" placeholder="Örn: Reis">
            </div>
            
            <label style="font-weight: bold; color: #fba94c;">Zorluk Modu:</label>
            <select id="mode-select">
                <option value="1">Normal Mod (10 Soru)</option>
                <option value="2">Zor Mod (Hardcore - 15 Soru)</option>
            </select>
        </div>
        
        <button onclick="oyunuBaslat()" style="width: 100%; text-align: center; background-color: #fba94c; color: #121214; font-size: 16px;">OYUNA BAŞLA</button>
    </div>

    <!-- Oyun Ekranı -->
    <div id="screen-game" class="hidden">
        <h1 id="game-title">ORUÇ REİS ORTAOKULU</h1>
        <h2 id="char-info">Karakter: </h2>
        
        <div class="stats">
            <div class="stat-item">Can: <span id="stat-can">100</span></div>
            <div class="stat-item">Stres: <span id="stat-stres">50</span></div>
            <div class="stat-item">Başarı: <span id="stat-basari">50</span></div>
        </div>

        <div class="card">
            <div class="crisis-title" id="crisis-title">OLAY BAŞLIĞI</div>
            <div class="crisis-text" id="crisis-text">Olay metni burada yer alacak...</div>
        </div>

        <div class="options" id="options-box"></div>

        <div id="feedback-box" class="feedback">Dönüt mesajı</div>
    </div>

    <!-- Sonuç Ekranı -->
    <div id="screen-end" class="hidden center-box">
        <h1 id="end-header" style="font-size: 24px; margin-bottom: 15px;">OYUN BİTTİ</h1>
        <p id="end-text" style="line-height: 1.6; margin-bottom: 25px; color: #c4c4cc;"></p>
        <button onclick="anaMenuyeDon()" style="width: 100%; text-align: center; background-color: #00b37e; font-size: 16px;">Ana Menüye Dön</button>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
