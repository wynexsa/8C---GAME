<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>8-C Hayatta Kalma Simülatörü</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .game-container {
            width: 100%;
            max-width: 500px;
            background: #1e293b;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            position: relative;
            overflow: hidden;
        }

        .screen {
            display: none;
        }

        .screen.active {
            display: block;
        }

        h1, h2, h3 {
            text-align: center;
            margin-bottom: 15px;
        }

        .user-info {
            background: #334155;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px;
            font-size: 0.9em;
        }

        .main-btn {
            width: 100%;
            padding: 14px;
            margin: 8px 0;
            border: none;
            border-radius: 10px;
            background: #3b82f6;
            color: white;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.1s, background 0.2s;
        }

        .main-btn:hover {
            background: #2563eb;
        }

        .main-btn:active {
            transform: scale(0.98);
        }

        .top-bar {
            display: flex;
            justify-content: space-around;
            align-items: center;
            background: #334155;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 15px;
            font-weight: bold;
        }

        .option-btn {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: 2px solid #475569;
            border-radius: 8px;
            background: #1e293b;
            color: white;
            font-size: 0.95em;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s;
        }

        .option-btn:hover {
            border-color: #3b82f6;
            background: #334155;
        }

        .shop-card {
            background: #334155;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .shop-card.aktif {
            border: 2px solid #22c55e;
        }

        select {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            background: #334155;
            color: white;
            border: 1px solid #475569;
            margin-bottom: 15px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th, td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid #334155;
        }

        .scenario-box {
            text-align: center;
            padding: 40px 20px;
            font-size: 1.2em;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="game-container">

    <!-- ANA MENÜ / LOBİ -->
    <div id="startScreen" class="screen active">
        <h1>🏫 8-C Hayatta Kalma</h1>
        
        <div class="user-info">
            <span>🪙 Altın: <b id="menuPara">0</b></span>
            <span>💎 Elmas: <b id="menuElmas">0</b></span>
            <span>⭐ Seviye: <b id="menuSeviye">1</b></span>
            <span>🔥 XP: <b id="menuXP">0</b></span>
        </div>

        <div style="margin-bottom: 15px; text-align: center;">
            <small style="color: #94a3b8;">Aktif Karakter:</small>
            <div id="oyuncuKarakterGosterge" style="font-weight: bold; font-size: 1.1em;">Normal Öğrenci</div>
        </div>

        <label for="mode-select" style="font-size: 0.9em; color: #cbd5e1;">Zorluk Seç:</label>
        <select id="mode-select">
            <option value="kolay">Kolay (5 Senaryo)</option>
            <option value="normal" selected>Normal (10 Senaryo)</option>
            <option value="zor">Zor (20 Senaryo - Stresle Ölüm Var!)</option>
        </select>

        <button class="main-btn" onclick="oyunuBaslatTikla()">🎮 Oyuna Başla</button>
        <button class="main-btn" style="background: #059669;" onclick="sayfaDegis('shopScreen')">🛒 Mağaza</button>
        <button class="main-btn" style="background: #d97706;" onclick="liderlikAc()">🏆 Liderlik Tablosu</button>
        <button class="main-btn" style="background: #475569;" onclick="openSupport()">📧 Destek & İletişim</button>
    </div>

    <!-- MAĞAZA EKRANI -->
    <div id="shopScreen" class="screen">
        <h2>🛒 Mağaza</h2>
        <div class="user-info">
            <span>🪙 Altın: <b id="shopPara">0</b></span>
            <span>💎 Elmas: <b id="shopElmas">0</b></span>
        </div>

        <h3>Karakterler</h3>
        <div id="characterShopList"></div>

        <h3 style="margin-top: 15px;">Takviyeler (Boost)</h3>
        <div id="boostShopList"></div>

        <button class="main-btn" style="background: #64748b; margin-top: 15px;" onclick="sayfaDegis('startScreen')">⬅️ Menüye Dön</button>
    </div>

    <!-- LİDERLİK TABLOSU EKRANI -->
    <div id="leaderboardScreen" class="screen">
        <h2>🏆 Liderlik Tablosu</h2>
        <table>
            <thead>
                <tr>
                    <th>Sıra</th>
                    <th>İsim</th>
                    <th>XP</th>
                    <th>Seviye</th>
                </tr>
            </thead>
            <tbody id="leaderboardBody"></tbody>
        </table>
        <button class="main-btn" style="background: #64748b; margin-top: 20px;" onclick="sayfaDegis('startScreen')">⬅️ Menüye Dön</button>
    </div>

    <!-- OYUN / QUIZ EKRANI -->
    <div id="quizScreen" class="screen">
        <div class="top-bar">
            <div>❤️ Can: <span id="livesCount">100</span></div>
            <div>😰 Stres: <span id="stressCount">%0</span></div>
            <div>⭐ Puan: <span id="scoreCount">0</span></div>
        </div>

        <!-- Senaryo Geçiş Animasyonu -->
        <div id="scenarioBox" class="scenario-box" style="display: none;">
            ⏳ Senaryo Yükleniyor...
        </div>

        <!-- Soru/Senaryo Kutusu -->
        <div id="quizContentBox">
            <div id="questionNum" style="color: #94a3b8; font-size: 0.85em; margin-bottom: 5px;"></div>
            <div id="questionText" style="font-size: 1.1em; font-weight: bold; margin-bottom: 15px;"></div>
            <div id="optionsList"></div>
            <button id="nextBtn" class="main-btn" style="display: none; margin-top: 15px; background: #22c55e;" onclick="sonrakiSoruTikla()">Sonraki Senaryo ➔</button>
        </div>
    </div>

    <!-- OYUN BİTTİ EKRANI -->
    <div id="gameOverScreen" class="screen" style="text-align: center;">
        <h2 id="endTitle">Oyun Bitti</h2>
        <div id="endMessage" style="margin: 20px 0; font-size: 1.1em; line-height: 1.5;"></div>
        <div style="font-size: 1.3em; margin-bottom: 20px;">Toplanan Puan: <b id="finalScore" style="color: #eab308;">0</b></div>
        <button class="main-btn" onclick="anaMenuyeDon()">🏠 Menüye Dön</button>
    </div>

</div>

<script src="script.js"></script>
</body>
</html>
